<div class="profile-layout">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <h1>Gestion de profil</h1>
      <p>Mettez à jour vos informations personnelles et professionnelles</p>
    </div>

    <div class="content-grid">
      <!-- Carte de Profil -->
      <div class="profile-card">
        <h3>Carte de Profil</h3>
        
        <div class="photo-section">
          <div class="photo-container">
            <img [src]="photoPreview || 'https://via.placeholder.com/150'" alt="Photo de profil" />
          </div>
          <input
            type="file"
            #fileInput
            (change)="onPhotoChange($event)"
            accept="image/*"
            style="display: none"
          />
          <button type="button" class="btn-upload" (click)="fileInput.click()">
            Changer la photo
          </button>
        </div>

        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" [(ngModel)]="profile.fullName" [disabled]="!editMode" />
        </div>

        <div class="form-group">
          <label>Spécialité</label>
          <input type="text" [(ngModel)]="profile.speciality" [disabled]="!editMode" />
        </div>

        <div class="form-group">
          <label>Numéro RPPS / Licence</label>
          <input type="text" [(ngModel)]="profile.rpps" [disabled]="!editMode" />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="profile.email" [disabled]="!editMode" />
        </div>

        <div class="form-group">
          <label>Téléphone</label>
          <input type="tel" [(ngModel)]="profile.phone" [disabled]="!editMode" />
        </div>

        <div class="form-group">
          <label>Adresse de la clinique</label>
          <input type="text" [(ngModel)]="profile.address" [disabled]="!editMode" />
        </div>

        <button type="button" *ngIf="!editMode" class="btn-edit" (click)="editMode = true">
          Modifier les informations
        </button>
      </div>

      <!-- Sécurité -->
      <div class="security-card">
        <h3>Sécurité</h3>

        <div class="form-group">
          <label>Mot de passe actuel</label>
          <div class="password-input">
            <input
              [type]="showCurrentPassword ? 'text' : 'password'"
              [(ngModel)]="currentPassword"
              placeholder="••••••••"
            />
            <button type="button" (click)="showCurrentPassword = !showCurrentPassword">
              <svg *ngIf="!showCurrentPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showCurrentPassword" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label>Nouveau mot de passe</label>
          <input
            type="password"
            [(ngModel)]="newPassword"
            placeholder="Laisser vide pour ne pas changer"
          />
        </div>

        <div class="form-group">
          <label>Confirmer le nouveau mot de passe</label>
          <input
            type="password"
            [(ngModel)]="confirmPassword"
            placeholder="Confirmer le nouveau mot de passe"
          />
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button type="button" class="btn-secondary" (click)="cancel()">Annuler</button>
      <button type="button" class="btn-primary" (click)="saveProfile()">
        Enregistrer les modifications
      </button>
    </div>
  </main>
</div>
